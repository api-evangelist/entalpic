aid: entalpic
name: Entalpic
description: >-
  Entalpic is an AI-driven materials science company that designs molecules and
  materials for industrial processes by combining machine learning, atomistic
  simulations, and experimental feedback loops to engineer surfaces and
  materials at the atomic scale. Its work spans a Discovery Engine for
  high-throughput screening of chemical spaces, process modeling with ML-plus-CFD
  digital twins, and quantum/atomistic simulation for surface chemistry, applied
  to semiconductors and thin-film coatings, battery cathode and interface
  chemistry, catalysis and active-site design, and advanced specialty materials.
  Founded in 2024 with research roots at the Mila AI lab, the company is based at
  Station F in Paris and Mila in Montreal and raised an 8.5M euro seed round.
  Entalpic does not currently publish a public developer API, SDKs, or API
  documentation; this profile tracks its public web surface for the API
  Evangelist network.
